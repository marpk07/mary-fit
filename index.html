<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MARY · Fitness & Performance Suite</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs (Firestore) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <link rel="apple-touch-icon" href="https://emojicdn.elk.sh/🍎?style=apple">
  <link rel="icon" href="https://emojicdn.elk.sh/🍎?style=apple">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: 
        radial-gradient(circle at 10% 15%, rgba(217, 167, 199, 0.22) 0%, transparent 40%),
        radial-gradient(circle at 90% 85%, rgba(180, 146, 205, 0.22) 0%, transparent 45%),
        linear-gradient(135deg, #fcf8fa 0%, #f7f1f5 50%, #f3ecf5 100%);
      color: #3d2c3d;
      min-height: 100vh;
      margin: 0;
      padding-bottom: 60px;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(217, 167, 199, 0.4);
      box-shadow: 0 10px 30px rgba(120, 80, 100, 0.06);
    }

    .nav-tab {
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .nav-tab.active {
      background: linear-gradient(135deg, #b492cd 0%, #c879a8) !important;
      color: #ffffff !important;
      font-weight: 800;
      box-shadow: 0 4px 15px rgba(180, 146, 205, 0.4);
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f0e6ed; }
    ::-webkit-scrollbar-thumb { background: #d9a7c7; border-radius: 999px; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-[#d9a7c7] selection:text-white">

  <!-- HEADER -->
  <header class="bg-white/90 backdrop-blur-md sticky top-0 z-40 border-b border-[#ebd7e3] shadow-xs">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-3">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-[#b492cd] to-[#d9a7c7] flex items-center justify-center font-black text-white text-base shadow-md">🍎</div>
        <div>
          <h1 class="text-sm font-black tracking-widest uppercase text-stone-800">MARY <span class="text-[#c879a8]">FITNESS SUITE</span></h1>
          <p class="text-[10px] font-medium text-stone-500 italic">"Construyendo constancia paso a paso"</p>
        </div>
      </div>

      <nav class="flex items-center gap-1.5 bg-[#f7f0f4] p-1 rounded-2xl border border-[#ebd7e3] overflow-x-auto max-w-full">
        <button onclick="switchTab('resumen')" id="btn-resumen" class="nav-tab active px-3 py-1.5 rounded-xl font-bold text-xs text-stone-600 whitespace-nowrap">📊 Resumen</button>
        <button onclick="switchTab('alimentacion')" id="btn-alimentacion" class="nav-tab px-3 py-1.5 rounded-xl font-bold text-xs text-stone-600 whitespace-nowrap">🥗 Alimentación</button>
        <button onclick="switchTab('cardio')" id="btn-cardio" class="nav-tab px-3 py-1.5 rounded-xl font-bold text-xs text-stone-600 whitespace-nowrap">🏃‍♀️ Cardio</button>
        <button onclick="switchTab('entreno')" id="btn-entreno" class="nav-tab px-3 py-1.5 rounded-xl font-bold text-xs text-stone-600 whitespace-nowrap">🏋️‍♀️ Entreno</button>
        <button onclick="switchTab('calendario')" id="btn-calendario" class="nav-tab px-3 py-1.5 rounded-xl font-bold text-xs text-stone-600 whitespace-nowrap">📅 Calendario</button>
        <button onclick="switchTab('bienestar')" id="btn-bienestar" class="nav-tab px-3 py-1.5 rounded-xl font-bold text-xs text-stone-600 whitespace-nowrap">💖 Bienestar & Salud</button>
      </nav>

      <div class="flex items-center space-x-2">
        <input type="date" id="global-date" onchange="changeGlobalDate(this.value)" class="bg-white border border-[#ebd7e3] rounded-xl px-3 py-1.5 text-xs font-black text-stone-700 shadow-xs outline-none">
        <button onclick="saveAllData()" class="px-3.5 py-1.5 bg-[#b492cd] text-white font-black text-xs rounded-xl shadow-md transition cursor-pointer">💾 Guardar</button>
      </div>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="flex-1 max-w-7xl mx-auto w-full p-4 sm:p-6 space-y-6">

    <!-- 1. RESUMEN -->
    <section id="view-resumen" class="space-y-6">
      <div class="glass-card rounded-3xl p-5 space-y-3">
        <h3 class="text-xs font-black uppercase tracking-wider text-stone-800 border-b border-[#ebd7e3] pb-2">📌 Resumen General</h3>
        <div id="resumen-stats" class="grid grid-cols-1 sm:grid-cols-3 gap-3"></div>
      </div>
      <div class="glass-card rounded-3xl p-5 space-y-3">
        <h3 class="text-xs font-black uppercase tracking-wider text-stone-800 border-b border-[#ebd7e3] pb-2">🎯 Metas & Hábitos</h3>
        <div id="resumen-goals" class="space-y-2 text-xs"></div>
      </div>
    </section>

    <!-- 2. ALIMENTACIÓN -->
    <section id="view-alimentacion" class="space-y-6 hidden">
      <div class="glass-card rounded-3xl p-5 space-y-4">
        <h3 class="text-xs font-black uppercase tracking-wider text-stone-800">🥗 Control de Alimentación & Macros</h3>
        <div class="grid grid-cols-1 sm:grid-cols-6 gap-2 text-xs">
          <input type="text" id="food-name" placeholder="Alimento..." class="sm:col-span-2 bg-white border border-[#ebd7e3] rounded-xl px-3 py-2 font-bold">
          <input type="number" id="food-cal" placeholder="Calorías (kcal)" class="bg-white border border-[#ebd7e3] rounded-xl px-3 py-2 font-bold">
          <input type="number" id="food-prot" placeholder="Proteína (g)" class="bg-white border border-[#ebd7e3] rounded-xl px-3 py-2 font-bold">
          <input type="number" id="food-carb" placeholder="Carbs (g)" class="bg-white border border-[#ebd7e3] rounded-xl px-3 py-2 font-bold">
          <input type="number" id="food-fat" placeholder="Grasa (g)" class="bg-white border border-[#ebd7e3] rounded-xl px-3 py-2 font-bold">
        </div>
        <button onclick="addFoodItem()" class="px-4 py-2 bg-[#b492cd] text-white rounded-xl text-xs font-black cursor-pointer">+ Registrar Alimento</button>
      </div>
      <div class="glass-card rounded-3xl p-4 space-y-3">
        <input type="text" id="food-search" oninput="renderFoodLogs()" placeholder="🔍 Buscar alimento..." class="w-full bg-white border border-[#ebd7e3] rounded-xl px-3 py-2 text-xs font-bold outline-none">
        <div id="food-logs-container" class="space-y-2"></div>
      </div>
    </section>

    <!-- 3. CARDIO -->
    <section id="view-cardio" class="space-y-6 hidden">
      <div class="glass-card rounded-3xl p-5 space-y-4">
        <h3 class="text-xs font-black uppercase tracking-wider text-stone-800">🏃‍♀️ Registro de Cardio & Running</h3>
        <div class="grid grid-cols-1 sm:grid-cols-5 gap-2 text-xs">
          <input type="text" id="cardio-type" placeholder="Tipo (ej. Cinta)" class="bg-white border border-[#ebd7e3] rounded-xl px-3 py-2 font-bold">
          <input type="number" id="cardio-min" placeholder="Minutos" class="bg-white border border-[#ebd7e3] rounded-xl px-3 py-2 font-bold">
          <input type="number" step="0.1" id="cardio-km" placeholder="Kilómetros" class="bg-white border border-[#ebd7e3] rounded-xl px-3 py-2 font-bold">
          <input type="number" id="cardio-kcal" placeholder="Calorías" class="bg-white border border-[#ebd7e3] rounded-xl px-3 py-2 font-bold">
          <input type="text" id="cardio-pace" placeholder="Ritmo (ej. 11'44'')" class="bg-white border border-[#ebd7e3] rounded-xl px-3 py-2 font-bold">
        </div>
        <button onclick="addCardioSession()" class="px-4 py-2 bg-[#5fa89b] text-white rounded-xl text-xs font-black cursor-pointer">+ Registrar Sesión</button>
      </div>
      <div id="cardio-history-container" class="space-y-2"></div>
    </section>

    <!-- 4. ENTRENO -->
    <section id="view-entreno" class="space-y-6 hidden">
      <div class="glass-card rounded-3xl p-5 space-y-4">
        <h3 class="text-xs font-black uppercase tracking-wider text-stone-800">🏋️‍♀️ Registro de Fuerza & PRs</h3>
        <div class="grid grid-cols-1 sm:grid-cols-4 gap-2 text-xs">
          <input type="text" id="workout-name" placeholder="Rutina (ej. Pierna B)" class="bg-white border border-[#ebd7e3] rounded-xl px-3 py-2 font-bold">
          <input type="number" id="workout-min" placeholder="Minutos" class="bg-white border border-[#ebd7e3] rounded-xl px-3 py-2 font-bold">
          <input type="number" id="workout-kcal" placeholder="Calorías" class="bg-white border border-[#ebd7e3] rounded-xl px-3 py-2 font-bold">
          <input type="text" id="workout-rpe" placeholder="Esfuerzo RPE (ej. 8/10)" class="bg-white border border-[#ebd7e3] rounded-xl px-3 py-2 font-bold">
        </div>
        <textarea id="workout-notes" placeholder="Notas, sensaciones..." class="w-full bg-white border border-[#ebd7e3] rounded-xl p-2.5 text-xs font-medium outline-none" rows="2"></textarea>
        <button onclick="addWorkoutSession()" class="px-4 py-2 bg-[#b492cd] text-white rounded-xl text-xs font-black cursor-pointer">+ Guardar Entreno</button>
      </div>
      <div id="workout-logs-container" class="space-y-3"></div>
    </section>

    <!-- 5. CALENDARIO -->
    <section id="view-calendario" class="space-y-6 hidden">
      <div class="glass-card rounded-3xl p-5 space-y-4">
        <h3 class="text-xs font-black uppercase tracking-wider text-stone-800">📅 Calendario Histórico de Actividad</h3>
        <div id="calendar-grid" class="grid grid-cols-7 gap-2 text-center text-xs"></div>
      </div>
    </section>

    <!-- 6. BIENESTAR -->
    <section id="view-bienestar" class="space-y-6 hidden">
      <div class="glass-card rounded-3xl p-5 space-y-4">
        <h3 class="text-xs font-black uppercase tracking-wider text-stone-800">💖 Salud & Bienestar Diario</h3>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
          <input type="number" step="0.5" id="b-water" placeholder="Agua (L)" class="bg-white border border-[#ebd7e3] rounded-xl px-3 py-2 font-bold">
          <input type="number" step="0.5" id="b-sleep" placeholder="Sueño (hrs)" class="bg-white border border-[#ebd7e3] rounded-xl px-3 py-2 font-bold">
          <select id="b-mood" class="bg-white border border-[#ebd7e3] rounded-xl px-3 py-2 font-bold">
            <option value="Neutral 🧘‍♀️">Ánimo: Neutral</option>
            <option value="Motivada 🔥">Ánimo: Motivada</option>
            <option value="Cansada 🥱">Ánimo: Cansada</option>
          </select>
          <button onclick="saveWellness()" class="px-4 py-2 bg-[#c879a8] text-white rounded-xl text-xs font-black cursor-pointer">Guardar Bienestar</button>
        </div>
        <div id="wellness-history" class="space-y-2 pt-2"></div>
      </div>
    </section>

  </main>

  <div id="toast" class="fixed bottom-5 right-5 z-50 bg-[#3d2c3d] text-white px-4 py-2.5 rounded-2xl shadow-xl text-xs font-black transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
    ✨ ¡Datos cargados con éxito!
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCnhvfyXpwJdYOQFCvsyHDhgW9F3X7ARR4",
      authDomain: "marpk-816dd.firebaseapp.com",
      databaseURL: "https://marpk-816dd-default-rtdb.firebaseio.com",
      projectId: "marpk-816dd",
      storageBucket: "marpk-816dd.firebasestorage.app",
      messagingSenderId: "189644122232",
      appId: "1:189644122232:web:ed7894f1510a373d44658d"
    };

    let db = null;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    } catch(e) {}

    const STORAGE_KEY = 'MARY_FITNESS_DATA_V9';
    let currentDate = new Date().toISOString().slice(0, 10);

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch(e) {}
      return {
        food: [],
        cardio: [],
        workouts: [],
        wellness: []
      };
    }

    let maryData = loadData();

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(maryData));
      if (db) {
        db.collection('mary_fitness_v9').doc('main_data').set(maryData).catch(err => {});
      }
      showToast("💾 ¡Guardado exitosamente!");
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 2000);
    }

    function changeGlobalDate(val) {
      currentDate = val;
      renderAll();
    }

    function switchTab(tab) {
      ['resumen', 'alimentacion', 'cardio', 'entreno', 'calendario', 'bienestar'].forEach(t => {
        document.getElementById(`view-${t}`).classList.add('hidden');
        document.getElementById(`btn-${t}`).classList.remove('active');
      });
      document.getElementById(`view-${tab}`).classList.remove('hidden');
      document.getElementById(`btn-${tab}`).classList.add('active');
      if(tab === 'calendario') renderCalendar();
    }

    function init() {
      document.getElementById('global-date').value = currentDate;
      renderAll();
    }

    function renderAll() {
      renderResumen();
      renderFoodLogs();
      renderCardioHistory();
      renderWorkoutLogs();
      renderWellness();
    }

    function addFoodItem() {
      const name = document.getElementById('food-name').value;
      const cal = document.getElementById('food-cal').value;
      const prot = document.getElementById('food-prot').value;
      const carb = document.getElementById('food-carb').value;
      const fat = document.getElementById('food-fat').value;
      if(!name) return alert("Ingresa el alimento");
      
      if(!maryData.food) maryData.food = [];
      maryData.food.push({ id: Date.now(), date: currentDate, name, cal, prot, carb, fat });
      saveData();
      renderAll();
      document.getElementById('food-name').value = '';
      document.getElementById('food-cal').value = '';
      document.getElementById('food-prot').value = '';
      document.getElementById('food-carb').value = '';
      document.getElementById('food-fat').value = '';
    }

    function renderFoodLogs() {
      const container = document.getElementById('food-logs-container');
      const search = (document.getElementById('food-search').value || '').toLowerCase();
      container.innerHTML = '';
      if(!maryData.food) maryData.food = [];
      let filtered = maryData.food.filter(f => f.name.toLowerCase().includes(search));
      if(filtered.length === 0) {
        container.innerHTML = `<p class="text-xs text-stone-400 text-center py-2">No hay alimentos registrados.</p>`;
        return;
      }
      filtered.forEach(f => {
        container.innerHTML += `
          <div class="glass-card p-3 rounded-2xl flex justify-between items-center text-xs">
            <div>
              <strong>${f.date} - ${f.name}</strong>
              <p class="text-[10px] text-stone-500">🔥 ${f.cal} kcal | P: ${f.prot}g | C: ${f.carb}g | G: ${f.fat}g</p>
            </div>
            <button onclick="deleteFood(${f.id})" class="text-red-400 font-bold">✕</button>
          </div>`;
      });
    }

    function deleteFood(id) {
      maryData.food = maryData.food.filter(f => f.id !== id);
      saveData();
      renderAll();
    }

    function addCardioSession() {
      const type = document.getElementById('cardio-type').value;
      const min = document.getElementById('cardio-min').value;
      const km = document.getElementById('cardio-km').value;
      const kcal = document.getElementById('cardio-kcal').value;
      const pace = document.getElementById('cardio-pace').value;
      if(!min) return alert("Ingresa los minutos");
      if(!maryData.cardio) maryData.cardio = [];
      maryData.cardio.push({ id: Date.now(), date: currentDate, type, min, km, kcal, pace });
      saveData();
      renderAll();
      document.getElementById('cardio-min').value = '';
      document.getElementById('cardio-km').value = '';
      document.getElementById('cardio-kcal').value = '';
      document.getElementById('cardio-pace').value = '';
    }

    function renderCardioHistory() {
      const container = document.getElementById('cardio-history-container');
      container.innerHTML = '';
      if(!maryData.cardio) maryData.cardio = [];
      if(maryData.cardio.length === 0) {
        container.innerHTML = `<p class="text-xs text-stone-400 text-center py-4">No hay cardio registrado.</p>`;
        return;
      }
      maryData.cardio.forEach(c => {
        container.innerHTML += `
          <div class="glass-card p-3 rounded-2xl flex justify-between items-center text-xs">
            <div>
              <strong>${c.date} - ${c.type}</strong>
              <p class="text-[10px] text-stone-500">⏱️ ${c.min} min | 📍 ${c.km} km | 🔥 ${c.kcal} kcal | Ritmo: ${c.pace}</p>
            </div>
            <button onclick="deleteCardio(${c.id})" class="text-red-400 font-bold">✕</button>
          </div>`;
      });
    }

    function deleteCardio(id) {
      maryData.cardio = maryData.cardio.filter(c => c.id !== id);
      saveData();
      renderAll();
    }

    function addWorkoutSession() {
      const name = document.getElementById('workout-name').value;
      const min = document.getElementById('workout-min').value;
      const kcal = document.getElementById('workout-kcal').value;
      const rpe = document.getElementById('workout-rpe').value;
      const notes = document.getElementById('workout-notes').value;
      if(!name) return alert("Ingresa el nombre");
      if(!maryData.workouts) maryData.workouts = [];
      maryData.workouts.push({ id: Date.now(), date: currentDate, name, min, kcal, rpe, notes });
      saveData();
      renderAll();
      document.getElementById('workout-name').value = '';
      document.getElementById('workout-min').value = '';
      document.getElementById('workout-kcal').value = '';
      document.getElementById('workout-rpe').value = '';
      document.getElementById('workout-notes').value = '';
    }

    function renderWorkoutLogs() {
      const container = document.getElementById('workout-logs-container');
      container.innerHTML = '';
      if(!maryData.workouts) maryData.workouts = [];
      if(maryData.workouts.length === 0) {
        container.innerHTML = `<p class="text-xs text-stone-400 text-center py-4">No hay entrenamientos de fuerza.</p>`;
        return;
      }
      maryData.workouts.forEach(w => {
        container.innerHTML += `
          <div class="glass-card p-3 rounded-2xl space-y-1 text-xs">
            <div class="flex justify-between">
              <strong>${w.date} - ${w.name}</strong>
              <button onclick="deleteWorkout(${w.id})" class="text-red-400 font-bold">✕</button>
            </div>
            <p class="text-stone-600">⏱️ ${w.min} min | 🔥 ${w.kcal} kcal | RPE: ${w.rpe}</p>
            ${w.notes ? `<p class="text-stone-400 italic">${w.notes}</p>` : ''}
          </div>`;
      });
    }

    function deleteWorkout(id) {
      maryData.workouts = maryData.workouts.filter(w => w.id !== id);
      saveData();
      renderAll();
    }

    function saveWellness() {
      const water = document.getElementById('b-water').value;
      const sleep = document.getElementById('b-sleep').value;
      const mood = document.getElementById('b-mood').value;
      if(!maryData.wellness) maryData.wellness = [];
      maryData.wellness.push({ id: Date.now(), date: currentDate, water, sleep, mood });
      saveData();
      renderWellness();
    }

    function renderWellness() {
      const container = document.getElementById('wellness-history');
      container.innerHTML = '';
      if(!maryData.wellness) maryData.wellness = [];
      maryData.wellness.forEach(w => {
        container.innerHTML += `
          <div class="glass-card p-2 rounded-xl text-xs flex justify-between items-center">
            <span>📅 ${w.date} | 💧 ${w.water}L | 💤 ${w.sleep}hrs | 🧘‍♀️ ${w.mood}</span>
            <button onclick="deleteWellness(${w.id})" class="text-red-400 font-bold">✕</button>
          </div>`;
      });
    }

    function deleteWellness(id) {
      maryData.wellness = maryData.wellness.filter(w => w.id !== id);
      saveData();
      renderAll();
    }

    function renderResumen() {
      const stats = document.getElementById('resumen-stats');
      const goals = document.getElementById('resumen-goals');
      if(!maryData.food) maryData.food = [];
      let totalCal = maryData.food.reduce((a,b)=>a+parseFloat(b.cal||0),0);
      let totalProt = maryData.food.reduce((a,b)=>a+parseFloat(b.prot||0),0);
      let totalKm = (maryData.cardio || []).reduce((a,b)=>a+parseFloat(b.km||0),0).toFixed(1);

      stats.innerHTML = `
        <div class="glass-card p-3 rounded-2xl text-xs"><strong class="text-stone-400 block">Total Calorías</strong><span class="text-base font-black">${totalCal} kcal</span></div>
        <div class="glass-card p-3 rounded-2xl text-xs"><strong class="text-stone-400 block">Total Proteína</strong><span class="text-base font-black">${totalProt} g</span></div>
        <div class="glass-card p-3 rounded-2xl text-xs"><strong class="text-stone-400 block">Cardio Total</strong><span class="text-base font-black">${totalKm} km</span></div>
      `;
      goals.innerHTML = `<p class="text-xs text-stone-500">Resumen operativo de tu suite activado con éxito.</p>`;
    }

    function renderCalendar() {
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';
      for(let i=1; i<=30; i++) {
        grid.innerHTML += `<div class="h-10 rounded-xl bg-white border border-[#ebd7e3] flex items-center justify-center text-xs font-bold">${i}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
